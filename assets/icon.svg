<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="GLM Plan Usage">
  <title>GLM Plan Usage</title>

  <!-- Rounded app tile, fills the canvas with a small safe margin -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#f7f8fa"/>

  <!-- Usage gauge track: 270-degree arc with an open gap at the bottom -->
  <path d="M39.2 88.8A35 35 0 1 1 88.8 88.8"
        fill="none" stroke="#131212" stroke-opacity="0.38"
        stroke-width="11" stroke-linecap="round"/>

  <!-- Progress arc: about three quarters of the plan consumed -->
  <path d="M39.2 88.8A35 35 0 1 1 96.3 50.6"
        fill="none" stroke="#131212"
        stroke-width="11" stroke-linecap="round"/>

  <!-- Letter Z: transcribed from official zhipuai.cn logo.svg (viewBox 31.5x26.5,
       scaled 1.2x, centered at 64,64). Three detached slabs: thin sheared bars with
       54.5-degree miter ends, heavy diagonal with horizontal-cut ends. -->
  <path d="M64.95 48.14L62.3 51.86L60.47 52.79H46.05V48.14Z
           M82.9 48.14L60.22 79.93H45.1L67.78 48.14Z
           M63.05 79.93L65.72 76.19L67.55 75.26H81.96V79.93Z"
        fill="#131212"/>
</svg>
